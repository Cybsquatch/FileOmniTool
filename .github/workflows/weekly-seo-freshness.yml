name: Editorial Freshness Tracker

on:
  # Real content edits: bump dateModified only for articles whose content changed
  push:
    branches: [main]
    paths:
      - 'web/src/lib/articles-*.ts'
  # Weekly check: report articles that need a genuine refresh
  schedule:
    # Runs every Monday at 03:00 UTC (05:00 CEST)
    - cron: '0 3 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write
  issues: write

concurrency:
  group: editorial-freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect real content changes & stale articles
        id: freshness
        run: |
          cd web
          node scripts/weekly-freshness.mjs

      - name: Commit updated dateModified to Main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status -s web/src/lib/ web/scripts/content-hashes.json) ]]; then
            git add web/src/lib/ web/scripts/content-hashes.json
            git commit -m "chore(seo): update dateModified for edited articles [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No content changes detected."
          fi

      - name: Notify search engines (IndexNow) only after real updates
        if: steps.commit.outputs.pushed == 'true'
        run: |
          cd web
          sleep 120 # give Vercel time to deploy the new version
          node scripts/ping-bots.mjs

      - name: Open or update "articles to refresh" issue
        if: github.event_name != 'push' && steps.freshness.outputs.stale_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_MD: ${{ steps.freshness.outputs.stale_md }}
        run: |
          TITLE="Articoli da aggiornare (editorial freshness)"
          NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [[ -n "$NUM" ]]; then
            gh issue edit "$NUM" --body "$STALE_MD"
          else
            gh issue create --title "$TITLE" --body "$STALE_MD"
          fi
